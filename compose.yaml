services:
    laravel.test:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-80}:80'
            - '${VITE_BIND_ADDRESS:-127.0.0.1}:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            LARAVEL_PDF_TEMP_PATH: '${LARAVEL_PDF_TEMP_PATH:-/var/www/html/storage/app/browsershot}'
            PUPPETEER_CACHE_DIR: '${PUPPETEER_CACHE_DIR:-/home/sail/.cache/puppeteer}'
        volumes:
            - '.:/var/www/html'
            - 'sail-puppeteer:/home/sail/.cache/puppeteer'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
            - meilisearch
            - mailpit            
    queue:
        image: 'sail-8.5/app'
        restart: unless-stopped
        command: php artisan queue:work database --queue=pdf,default --sleep=2 --tries=3 --timeout=${PDF_GENERATION_JOB_TIMEOUT:-900} --max-time=3600 --memory=512
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            LARAVEL_PDF_TEMP_PATH: '${LARAVEL_PDF_TEMP_PATH:-/var/www/html/storage/app/browsershot}'
            PUPPETEER_CACHE_DIR: '${PUPPETEER_CACHE_DIR:-/home/sail/.cache/puppeteer}'
        volumes:
            - '.:/var/www/html'
            - 'sail-puppeteer:/home/sail/.cache/puppeteer'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
        healthcheck:
            test: ['CMD-SHELL', 'pgrep -f "[a]rtisan queue:work" >/dev/null']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
    mysql:
        image: 'mysql:8.4'
        restart: unless-stopped
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        restart: unless-stopped
        ports:
            - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    meilisearch:
        image: 'getmeili/meilisearch:latest'
        restart: unless-stopped
        ports:
            - '${MEILISEARCH_BIND_ADDRESS:-127.0.0.1}:${FORWARD_MEILISEARCH_PORT:-7700}:7700'
        environment:
            MEILI_NO_ANALYTICS: '${MEILISEARCH_NO_ANALYTICS:-false}'
        volumes:
            - 'sail-meilisearch:/meili_data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - wget
                - '--no-verbose'
                - '--spider'
                - 'http://127.0.0.1:7700/health'
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        restart: unless-stopped
        ports:
            - '${MAILPIT_BIND_ADDRESS:-127.0.0.1}:${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${MAILPIT_BIND_ADDRESS:-127.0.0.1}:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    sail-meilisearch:
        driver: local
    sail-puppeteer:
        driver: local
