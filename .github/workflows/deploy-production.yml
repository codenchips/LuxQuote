name: Deploy Production

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      LARAVEL_PDF_TEMP_PATH: ${{ github.workspace }}/storage/app/browsershot
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.cache/puppeteer

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out release
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, fileinfo, intl, mbstring, pdo_mysql, zip
          tools: composer:v2
          coverage: none
        env:
          fail-fast: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Check production PHP platform requirements
        run: composer check-platform-reqs --no-dev

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production frontend dependencies
        run: npm audit --omit=dev

      - name: Build production assets
        run: npm run build

      - name: Bootstrap Laravel packages
        run: composer run-script post-autoload-dump

      - name: Install PDF runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf
          sudo env "PATH=$PATH" "PUPPETEER_CACHE_DIR=$PUPPETEER_CACHE_DIR" npx puppeteer browsers install chrome --install-deps

          chrome_path="$(node --input-type=module -e 'import puppeteer from "puppeteer"; process.stdout.write(await puppeteer.executablePath());')"
          test -x "$chrome_path"
          echo "PUPPETEER_EXECUTABLE_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Run application test suite
        run: php artisan test --compact

  deploy:
    name: Deploy to production VPS
    needs: verify
    runs-on: [self-hosted, luxquote-production]
    environment: production

    steps:
      - name: Run production deploy
        env:
          PUBLIC_URL: ${{ secrets.PRODUCTION_URL || 'https://quote.tamlite.co.uk' }}
        run: |
          set -euo pipefail
          cd /home/tamliteco/luxquote.app
          git config --global --add safe.directory /home/tamliteco/luxquote.app
          git fetch origin production

          incoming_deploy_script="$(mktemp /tmp/luxquote-deploy-production-XXXXXX.sh)"
          trap 'rm -f -- "$incoming_deploy_script"' EXIT
          git show origin/production:scripts/deploy-production.sh > "$incoming_deploy_script"

          APP_DIR=/home/tamliteco/luxquote.app DEPLOY_BRANCH=production PUBLIC_URL="$PUBLIC_URL" bash "$incoming_deploy_script"

      - name: Ensure deploy maintenance mode is cleared
        if: always()
        run: |
          set -euo pipefail
          cd /home/tamliteco/luxquote.app

          maintenance_marker="storage/framework/luxquote-deploy-maintenance"

          if [ ! -f "$maintenance_marker" ]; then
            echo 'No deploy-owned maintenance marker remains.'
            exit 0
          fi

          echo 'Deploy-owned maintenance marker found; returning Laravel to normal mode.'
          docker compose up -d laravel.test
          docker compose exec -T laravel.test php artisan up --no-interaction
          rm -f "$maintenance_marker"

      - name: Check persistent runner migration
        if: success()
        run: |
          set -euo pipefail

          if docker inspect luxquote-github-runner \
            --format '{{ range .Mounts }}{{ println .Destination }}{{ end }}' \
            | grep --fixed-strings --line-regexp --quiet '/runner/config'; then
            echo 'Persistent GitHub runner configuration is installed.'
            exit 0
          fi

          echo '::warning title=Runner maintenance required::The deploy succeeded, but the GitHub runner still uses non-persistent registration. Run the checked-in setup script on the VPS before a later runner restart.'

          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## VPS runner maintenance still required

          This deployment succeeded, but `luxquote-github-runner` still uses its old non-persistent registration. At a quiet time, run as `root` on the VPS:

          ```bash
          cd /home/tamliteco/luxquote.app
          bash scripts/setup-production-github-runner.sh
          ```

          Follow the one-time runner migration checklist in `DEPLOYMENT.md`. This warning will disappear after `/runner/config` is mounted by the persistent setup.
          EOF
